    <div class="panel">
    <p>Frau Müller möchte eine Ausbildung als Medienkauffrau machen. Du schaust ihr Vorstellungsgespräch an, aber plötzlich ist die Tür zu! Um hinauszukommen, gehst du durch <strong>vier Räume</strong>. In jedem Raum siehst du einen Teil des Videos und löst Rätsel. Am Ende jedes Raums öffnest du ein Schloss und bekommst einen Schlüssel. An der Ausgangstür wartet das letzte Zahlenschloss.</p>
    <p class="it">Frau Müller vuole diventare Medienkauffrau. Guardi il suo colloquio, ma all'improvviso la porta si chiude! Per uscire attraversi quattro stanze: in ognuna guardi una parte del video e risolvi gli enigmi. Alla fine di ogni stanza apri un lucchetto e ricevi una chiave. Alla porta d'uscita ti aspetta l'ultimo lucchetto.</p>
    <p>💡 Ein Tipp kostet <strong>60 Sekunden</strong>, ein falscher Code am Schloss <strong>30 Sekunden</strong>.</p>
    <p class="it">Un aiuto costa 60 secondi, un codice sbagliato al lucchetto 30 secondi.</p>
    ${b?`<p class="small">Deine Bestzeit: ${fmt(b)}</p>`:''}
    <p class="small">🎧 Usa le cuffie. Serve la connessione a Internet per il video.</p>
    <button class="primary" id="go">Spiel starten</button></div>
    <p class="small" style="text-align:center">Video: „Bewerbungsgespräch: richtig“ · MOJO – Motiviert in den Job (YouTube)</p>`;
  document.getElementById('go').onclick = () => { newGame(); G.timer = setInterval(tick, 1000); room(); };
}
function videoPanel(title, it, seg, label){
  return `<div class="panel"><div class="room-tag">${esc(title)}</div><p class="it" style="margin-top:0">${esc(it)}</p>
    <p>Schau diesen Teil des Videos (${mmss(seg[0])}–${mmss(seg[1])}). Du kannst ihn so oft sehen, wie du willst.<br><span class="it">Guarda questa parte del video, tutte le volte che vuoi.</span></p>
    <div class="vid"><div id="ytp"></div></div><p class="small" id="ytl"></p><div id="lb"></div></div><div class="panel" id="pz"></div>`;
}
function room(){
  stopAudio();
  if (G.room >= ROOMS.length) return finalRoom();
  const R = ROOMS[G.room], total = R.puzzles.length + 1;
  app.innerHTML = hud() + videoPanel(R.name, R.it, R.seg);
  mountPlayer(R.seg);
  document.getElementById('lb').appendChild(listenBtn('▶ Diesen Teil abspielen', R.seg));
  const pz = document.getElementById('pz');
  if (G.step < R.puzzles.length) puzzle(pz, R.puzzles[G.step], `Rätsel ${G.step+1} von ${total}`, () => { G.step++; nextStep(); });
  else lock(pz, R.lock, `Rätsel ${total} von ${total} · Das Schloss`, () => { G.room++; G.step = 0; room(); }, G.room < ROOMS.length-1 ? 'In den nächsten Raum' : 'Zur Ausgangstür');
}
function nextStep(){
  const R = ROOMS[G.room], pz = document.getElementById('pz'), total = R.puzzles.length + 1;
  stopAudio();
  if (G.step < R.puzzles.length) puzzle(pz, R.puzzles[G.step], `Rätsel ${G.step+1} von ${total}`, () => { G.step++; nextStep(); });
  else lock(pz, R.lock, `Rätsel ${total} von ${total} · Das Schloss`, () => { G.room++; G.step = 0; room(); }, G.room < ROOMS.length-1 ? 'In den nächsten Raum' : 'Zur Ausgangstür');
  pz.scrollIntoView({behavior:'smooth', block:'start'});
}
function hintRow(container, P){
  const d = document.createElement('div'); d.className = 'row'; d.style.marginTop = '8px';
  const hb = document.createElement('button'); hb.className = 'hint'; hb.textContent = '💡 Tipp (+60 s)';
  const box = document.createElement('div'); box.style.width = '100%';
  hb.onclick = () => {
    G.hints++; G.penalty += PENALTY_HINT; tick(); hb.disabled = true;
    box.innerHTML = `<div class="fb info">${esc(P.hint)}</div>`;
    if (P.seg){ const r = document.createElement('div'); r.className='row'; r.appendChild(listenBtn(`▶ Diese Stelle ansehen (${mmss(P.seg[0])})`, P.seg)); box.appendChild(r); }
    const hc = document.getElementById('hc'); if (hc) hc.textContent = 'Tipps: '+G.hints;
  };
  d.appendChild(hb); container.appendChild(d); container.appendChild(box);
}
function solved(pz, next, text, label){
  const fb = pz.querySelector('.fbz');
  fb.innerHTML = `<div class="fb ok">✅ ${text||'Richtig! Das Rätsel ist gelöst.'}</div>`;
  const b = document.createElement('button'); b.className = 'primary'; b.textContent = label || 'Weiter'; b.onclick = next; fb.appendChild(b);
  pz.querySelectorAll('.hint').forEach(h => h.disabled = true);
}
function wrong(pz, msg){
  const fb = pz.querySelector('.fbz');
  fb.innerHTML = `<div class="fb ko">${msg||'Noch nicht richtig. Schau noch einmal und versuch es wieder.<br><span class="it">Non ancora. Riguarda e riprova.</span>'}</div>`;
  pz.classList.remove('shake'); void pz.offsetWidth; pz.classList.add('shake');
}
function puzzle(pz, P, step, next){
  pz.innerHTML = `<div class="step">${step}</div>`;
  const body = document.createElement('div'); pz.appendChild(body);
  if (P.type === 'mc'){
    body.innerHTML = `<p><strong>${esc(P.q)}</strong></p><div class="opts">${P.opts.map((o,i)=>`<button class="opt" data-i="${i}">${'abc'[i]}) ${esc(o)}</button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (+b.dataset.i === P.c){ b.classList.add('right'); body.querySelectorAll('.opt').forEach(x=>x.disabled=true); solved(pz, next); }
      else { b.classList.add('wrong'); b.disabled = true; wrong(pz); }
    });
  }
  if (P.type === 'tf'){
    const sel = {};
    body.innerHTML = `<p><strong>${esc(P.q)}</strong></p>` + P.items.map((it,i)=>`<div class="tf"><span>${esc(it[0])}</span><span class="btns"><button data-i="${i}" data-v="1">richtig</button><button data-i="${i}" data-v="0">falsch</button></span></div>`).join('') + `<div style="margin-top:10px"><button class="primary" id="chk">Prüfen</button></div>`;
    body.querySelectorAll('.tf button').forEach(b => b.onclick = () => { sel[b.dataset.i] = b.dataset.v==='1'; body.querySelectorAll(`.tf button[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.toggle('sel', x===b)); });
    body.querySelector('#chk').onclick = () => {
      if (Object.keys(sel).length < P.items.length) return wrong(pz, 'Wähle bei jedem Satz „richtig“ oder „falsch“.<br><span class="it">Scegli per ogni frase.</span>');
      const n = P.items.filter((it,i)=>sel[i]===it[1]).length;
      if (n === P.items.length){ body.querySelector('#chk').disabled = true; solved(pz, next); }
      else wrong(pz, `${n} von ${P.items.length} sind richtig. Das Schloss bleibt zu: schau noch einmal!<br><span class="it">${n} su ${P.items.length} giuste: riguarda e correggi.</span>`);
    };
  }
  if (P.type === 'multi'){
    const items = shuffle(P.items.map((it,i)=>[...it,i]));
    body.innerHTML = `<p><strong>${esc(P.q)}</strong></p><div>${items.map(it=>`<label class="chk"><input type="checkbox" data-i="${it[2]}"> ${esc(it[0])}</label>`).join('')}</div><div style="margin-top:10px"><button class="primary" id="chk">Prüfen</button></div>`;
    body.querySelector('#chk').onclick = () => {
      const ok = P.items.every((it,i) => body.querySelector(`input[data-i="${i}"]`).checked === it[1]);
      if (ok){ body.querySelector('#chk').disabled = true; solved(pz, next); }
      else wrong(pz, 'Noch nicht ganz: Es fehlt ein Wort, oder ein Wort ist zu viel.<br><span class="it">Non ancora: manca una parola o ce n\'è una di troppo.</span>');
    };
  }
  if (P.type === 'gaps'){
    const opts = `<option value="">– wählen –</option>` + P.choices.map(c=>`<option>${esc(c)}</option>`).join('');
    const html = esc(P.q).replace(/\{(\d)\}/g, (m,k)=>`<select id="g${k}" aria-label="Lücke ${+k+1}">${opts}</select>`);
    body.innerHTML = `<p style="line-height:2.4">${html}</p><button class="primary" id="chk">Prüfen</button>`;
    body.querySelector('#chk').onclick = () => {
      const ok = P.answers.every((a,k)=>body.querySelector('#g'+k).value===a);
      if (ok){ body.querySelector('#chk').disabled = true; solved(pz, next); } else wrong(pz);
    };
  }
  const fbz = document.createElement('div'); fbz.className = 'fbz'; pz.appendChild(fbz);
  hintRow(pz, P);
}
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function dialHTML(n, letters){
  let h = '<div class="dial">';
  for (let i=0;i<n;i++) h += `<div class="wheel"><button data-w="${i}" data-d="1" aria-label="Rad ${i+1} vor">▲</button><div class="val" id="w${i}">${letters?'A':'0'}</div><button data-w="${i}" data-d="-1" aria-label="Rad ${i+1} zurück">▼</button></div>`;
  return h + '</div>';
}
function wireDial(root, vals, letters){
  const m = letters ? 26 : 10;
  root.querySelectorAll('.wheel button').forEach(b => b.onclick = () => { const i = +b.dataset.w; vals[i] = (vals[i] + +b.dataset.d + m) % m; root.querySelector('#w'+i).textContent = letters ? ABC[vals[i]] : vals[i]; });
}
function lock(pz, L, step, next, label){
  const letters = L.type === 'letter', n = L.type === 'text' ? 0 : (L.n || 1), vals = Array(n).fill(0);
  pz.innerHTML = `<div class="step">${step}</div><p><strong>🔒 ${esc(L.q)}</strong></p>
    <p class="it">${L.type==='text'?'Scrivi la parola per aprire il lucchetto.':'Imposta il lucchetto con le frecce.'}</p>
    <div class="lock">${L.type==='text' ? '<input type="text" id="lw" autocomplete="off" spellcheck="false" aria-label="Lösungswort">' : dialHTML(n, letters)}<button class="primary" id="op">Schloss öffnen</button></div><div class="fbz"></div>`;
  if (n) wireDial(pz, vals, letters);
  const value = () => L.type === 'text' ? pz.querySelector('#lw').value : vals.map(v => letters ? ABC[v] : v).join('');
  const check = () => {
    const v = value();
    if (L.type === 'text' && !v.trim()) return;
    const ok = L.type === 'text' ? L.a.some(a => norm(a) === norm(v)) : v === L.a;
    if (ok){ pz.querySelector('#op').disabled = true; solved(pz, next, '🔓 Das Schloss ist offen! Du bekommst einen Schlüssel.', label); }
    else { G.penalty += PENALTY_LOCK; tick(); wrong(pz, 'Das Schloss bleibt zu (+30 Sekunden).<br><span class="it">Il lucchetto resta chiuso (+30 secondi).</span>'); }
  };
  pz.querySelector('#op').onclick = check;
  if (L.type === 'text') pz.querySelector('#lw').onkeydown = e => { if (e.key === 'Enter') check(); };
  hintRow(pz, L);
}
function finalRoom(){
  stopAudio();
  app.innerHTML = hud() + videoPanel('Die Ausgangstür', 'La porta d\'uscita', FINAL.seg);
  mountPlayer(FINAL.seg);
  document.getElementById('lb').appendChild(listenBtn('▶ Diesen Teil abspielen', FINAL.seg));
  lock(document.getElementById('pz'), {type:'dial', n:4, q:FINAL.q, a:FINAL.a, hint:FINAL.hint, seg:FINAL.seg}, 'Das letzte Schloss', win, '🚪 Tür öffnen');
}
function win(){
  stopAudio(); clearInterval(G.timer);
  const t = elapsed(), b = best(), rec = !b || t < b; if (rec) setBest(t);
  app.innerHTML = `<div class="panel" style="text-align:center"><div class="big">🎉🚪</div><h1>Geschafft! Du bist frei!</h1><p class="it">Ce l'hai fatta! Sei uscito dalla escape room.</p>
    <div class="big">${fmt(t)}</div><p class="small">Tipps: ${G.hints} · ${rec?'Neue Bestzeit!':'Bestzeit: '+fmt(b)}</p>
    <div class="row" style="justify-content:center"><button class="primary" id="again">Noch einmal spielen</button><button id="tr">📄 Ganzes Gespräch lesen</button></div></div>
    <div class="panel trans" id="trans" style="display:none"></div>`;
  document.getElementById('again').onclick = intro;
  document.getElementById('tr').onclick = () => {
    const tr = document.getElementById('trans'); tr.style.display = 'block';
    tr.innerHTML = '<h2>Das Gespräch</h2>' + TRANSCRIPT.map(l => `<p><span class="small">${esc(l.t)}</span> <b>${esc(l.sp)}:</b> ${esc(l.x)}</p>`).join('');
  };
}
intro();

</script>
